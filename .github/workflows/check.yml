name: Check
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: crates/graphile-worker-admin-ui/package-lock.json
      - name: Check source-map offset regression
        run: |
          npm ci --prefix crates/graphile-worker-admin-ui --include=dev --ignore-scripts --no-audit --no-fund
          node .github/scripts/check_source_map_offsets.cjs
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Release API adapter regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Check OpenTelemetry 0.30 feature
        run: cargo check --all-targets --features opentelemetry_0_30
      - name: Check OpenTelemetry 0.31 feature
        run: cargo check --all-targets --features opentelemetry_0_31
      - name: Check OpenTelemetry 0.32 feature
        run: cargo check --all-targets --features opentelemetry_0_32
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings
